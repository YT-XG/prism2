# 自动打包发版：打 `v*` tag（如 v2.0.0）或手动触发时，
# 在 win/mac 分别构建安装包并发布到 GitHub Release（electron-builder --publish always）。
# 重跑会先清空该 tag 的旧 release（clean-release job），再全量重建，避免同名资产冲突。
#
# 前置要求：
#   1. 仓库设置 Settings → Actions → General → Workflow permissions 勾选 Read and write permissions；
#   2. 无需额外 secret：使用内置的 GITHUB_TOKEN（权限见下 permissions 声明）。
#   3. 发版流程：git tag v2.0.0 && git push origin v2.0.0

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 由这一个 job 唯一地准备好「空 release」：删掉该 tag 旧 release（存在才删）再新建空的。
  # build 依赖它：这样 win/mac 的 electron-builder 只会往已存在的 release 里添加各自资产，
  # 既不会再出现「同名资产 422」，也不会出现「win/mac 并发创建同一个 release 撞车」。
  prepare-release:
    name: Prepare fresh GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Delete existing release for tag (if re-run)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "preparing release: $GITHUB_REF_NAME"
          gh release delete --repo "${GITHUB_REPOSITORY}" "$GITHUB_REF_NAME" --yes || echo "no existing release (fresh run)"
      - name: Create fresh release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create --repo "${GITHUB_REPOSITORY}" "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "prism2 ${GITHUB_REF_NAME}"

  build:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # electron-vite 项目必须先编译出 out/main|preload|renderer，再交给 electron-builder 打包
      - name: Build (electron-vite)
        run: npm run build

      - name: Package & publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --publish always ${{ matrix.args }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/**
          if-no-files-found: error

  # 汇总三平台产物：生成自定义更新清单 latest.json，上传到 GitHub Release，并推送到 Gitee 锚点仓库。
  package-manifest:
    name: Package manifest (latest.json)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download built installers
        uses: actions/download-artifact@v4
        with:
          path: dist-all
          merge-multiple: true

      - name: Generate latest.json + upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from urllib.parse import quote
          tag = os.environ['GITHUB_REF_NAME']
          version = tag[1:] if tag.startswith('v') else tag
          repo = os.environ['GITHUB_REPOSITORY']
          base = f"https://github.com/{repo}/releases/download/{tag}"

          def sha256(path):
              h = hashlib.sha256()
              with open(path, 'rb') as f:
                  for c in iter(lambda: f.read(1 << 20), b''):
                      h.update(c)
              return h.hexdigest()

          def classify(name):
              n = name.lower()
              if n.endswith('.blockmap') or n.endswith('.dmg'):
                  return None  # 非安装包（校验分块/磁盘镜像）不作为更新二进制
              if n.endswith('.zip'):
                  return 'mac' if ('-mac' in n or 'mac-' in n or '-osx' in n) else ('win' if 'win' in n else None)
              if n.endswith('.exe'):
                  return 'win'
              return None

          binaries = []
          seen = set()
          for root, _, names in os.walk('dist-all'):
              for name in names:
                  platform = classify(name)
                  if not platform or platform in seen:
                      continue
                  seen.add(platform)
                  arch = next((a for a in ('universal', 'x64', 'arm64') if a in name), 'unknown')
                  binaries.append({
                      'platform': platform,
                      'arch': arch,
                      'url': f"{base}/{quote(name)}",
                      'sha256': sha256(os.path.join(root, name))
                  })

          manifest = {'version': version, 'notes': '', 'redirect': None, 'mirrors': [], 'binaries': binaries}
          with open('latest.json', 'w', encoding='utf-8') as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY
          gh release upload --repo "${GITHUB_REPOSITORY}" "$GITHUB_REF_NAME" latest.json --clobber

      - name: Generate R2 manifest (r2 base)
        env:
          PRISM2_UPDATE_BASE: ${{ vars.PRISM2_UPDATE_BASE || '' }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        run: |
          if [ -z "$PRISM2_UPDATE_BASE" ] || [ -z "$R2_ACCESS_KEY_ID" ]; then
            echo "R2 未配置，跳过 R2 清单生成（客户端走 Gitee→GitHub 兜底）。"
            exit 0
          fi
          # 从 GitHub 自包含清单生成「R2 版」：仅把 binaries[].url 前缀改写为 R2 下载基址，sha 不变。
          # 必须在本 job 把 latest.json 覆盖为 Gitee 跳板指针(binaries:[])之前生成。
          python3 - "$PRISM2_UPDATE_BASE" <<'PY'
          import json, os, sys
          from urllib.parse import unquote, urlparse
          base = sys.argv[1].rstrip('/')
          with open('latest.json', encoding='utf-8') as f:
              m = json.load(f)
          for b in m.get('binaries', []):
              name = unquote(os.path.basename(urlparse(b['url']).path))
              b['url'] = f"{base}/{name}"
          with open('r2-latest.json', 'w', encoding='utf-8') as f:
              json.dump(m, f, ensure_ascii=False, indent=2)
          print(json.dumps(m, ensure_ascii=False, indent=2))
          PY

      - name: Push latest.json to Gitee anchor (redirect pointer)
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_USER: ${{ secrets.GITEE_USER }}
          GITEE_ANCHOR_REPO: ${{ secrets.GITEE_ANCHOR_REPO }}
          PRISM2_UPDATE_BASE: ${{ vars.PRISM2_UPDATE_BASE || '' }}
        run: |
          if [ -z "$GITEE_TOKEN" ] || [ -z "$GITEE_USER" ] || [ -z "$GITEE_ANCHOR_REPO" ]; then
            echo "Gitee anchor secrets 未配置，跳过 Gitee 推送。"
            exit 0
          fi
          # Gitee 锚点改为「重定向指针」：客户端读 Gitee 主源 -> 跟随 redirect 到 R2 下载。
          # GitHub Release 里的 latest.json 保持自包含(binaries->GitHub)作兜底，不变。
          # R2 未配置（PRISM2_UPDATE_BASE 为空）时，redirect 回落到 GitHub 自包含清单：Gitee->GitHub 兜底。
          VERSION="${GITHUB_REF_NAME#v}"
          python3 - "$VERSION" "$PRISM2_UPDATE_BASE" "$GITHUB_REPOSITORY" <<'PY'
          import json, sys
          version, base, repo = sys.argv[1], sys.argv[2], sys.argv[3]
          if not base:
              base = f"https://github.com/{repo}/releases/latest/download"
          manifest = {"version": version, "redirect": f"{base}/latest.json", "binaries": []}
          with open('latest.json', 'w', encoding='utf-8') as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY
          git init
          git config user.email "action@users.noreply.github.com"
          git config user.name "GitHub Actions"
          git add latest.json
          git commit -m "release ${GITHUB_REF_NAME}"
          git branch -M master
          git remote add gitee "https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/${GITEE_ANCHOR_REPO}.git"
          git push -f gitee master

      - name: Verify Gitee anchor reachable
        env:
          GITEE_ANCHOR_REPO: ${{ secrets.GITEE_ANCHOR_REPO }}
        run: |
          if [ -z "$GITEE_ANCHOR_REPO" ]; then echo "GITEE_ANCHOR_REPO 未配置，跳过校验。"; exit 0; fi
          TAG="$GITHUB_REF_NAME"; VERSION="${TAG#v}"
          URL="https://gitee.com/${GITEE_ANCHOR_REPO}/raw/master/latest.json"
          body="$(curl -fsSL --max-time 30 "$URL")"
          remote="$(printf '%s' "$body" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("version",""))')"
          echo "Gitee 锚点 version=${remote}，期望=${VERSION}"
          [ "$remote" = "$VERSION" ] || { echo "Gitee 锚点版本不匹配（可能命中旧版/未成功推送），请检查 GITEE_TOKEN/GITEE_ANCHOR_REPO"; exit 1; }
          echo "Gitee 锚点校验通过。"

      # ===== CI 上传到 Cloudflare R2（主通道，客户端经 Gitee→R2 下载；R2 出站流量免费替代 OSS）=====
      - name: Upload installers + manifest to Cloudflare R2
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_ACCESS_KEY_SECRET: ${{ secrets.R2_ACCESS_KEY_SECRET }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'prism2' }}
          R2_KEY_PREFIX: ${{ vars.R2_KEY_PREFIX || 'prism2' }}
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_ACCESS_KEY_SECRET" ]; then
            echo "R2 凭证未配置，跳过 R2 上传（客户端走 Gitee→GitHub 兜底）。"
            exit 0
          fi
          (python3 -m pip install --quiet --break-system-packages boto3 2>/dev/null || python3 -m pip install --quiet boto3)
          python3 - <<'PY'
          import os, glob
          import boto3
          from botocore.config import Config
          account_id = os.environ["R2_ACCOUNT_ID"]
          ak_id = os.environ["R2_ACCESS_KEY_ID"]
          ak_secret = os.environ["R2_ACCESS_KEY_SECRET"]
          bucket_name = os.environ["R2_BUCKET"]
          prefix = os.environ.get("R2_KEY_PREFIX", "prism2").strip("/")
          endpoint = f"https://{account_id}.r2.cloudflarestorage.com"
          s3 = boto3.client(
              "s3",
              endpoint_url=endpoint,
              aws_access_key_id=ak_id,
              aws_secret_access_key=ak_secret,
              region_name="auto",
              config=Config(signature_version="s3v4"),
          )
          def up(path, key):
              s3.upload_file(path, bucket_name, key)
              print(f"  uploaded {key}")
          # 先上传二进制，最后上传 R2 版清单（latest.json，保证只在该版本二进制齐全后出现）
          for pat in ("dist-all/prism2-*-setup.exe", "dist-all/prism2-*-universal-mac.zip"):
              for f in glob.glob(pat):
                  if os.path.isfile(f):
                      up(f, f"{prefix}/{os.path.basename(f)}")
          if os.path.isfile("r2-latest.json"):
              up("r2-latest.json", f"{prefix}/latest.json")
          else:
              print("  (缺 r2-latest.json，跳过 R2 清单)")
          # 只保留当前版本：删除 R2 上所有其它版本号(prism2-<ver>-*)的对象；latest.json 不属于版本文件，保留
          import re
          current = os.environ.get("GITHUB_REF_NAME", "").lstrip("v")
          ver_re = re.compile(r"^prism2-(\d+\.\d+\.\d+).*?\.(exe|zip|blockmap|dmg)$")
          if re.match(r"^\d+\.\d+\.\d+$", current):
              deleted = 0
              paginator = s3.get_paginator("list_objects_v2")
              for page in paginator.paginate(Bucket=bucket_name, Prefix=f"{prefix}/"):
                  for obj in page.get("Contents", []):
                      name = obj["Key"].rsplit("/", 1)[-1]
                      m = ver_re.match(name)
                      if m and m.group(1) != current:
                          s3.delete_object(Bucket=bucket_name, Key=obj["Key"])
                          deleted += 1
                          print(f"  deleted old {obj['Key']}")
              print(f"R2 cleanup: keep v{current}, deleted {deleted} old version object(s)")
          else:
              print("  (非 tag 触发，跳过 R2 旧版本清理)")
          PY

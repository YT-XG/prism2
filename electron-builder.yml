appId: com.prism.next
# 打包名与 v1（productName: Prism）区分，避免安装目录/自启项/userData 目录（%APPDATA%\Prism 2）与 v1 冲突
productName: Prism 2
directories:
  output: dist
files:
  - out/**
  - resources/**
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
publish:
  provider: github
  # GitHub Release 发布目标：https://github.com/YT-XG/prism2
  owner: YT-XG
  repo: prism2
  # 关键：electron-builder 默认会把不存在的 release 建成“草稿”（draft），
  # 草稿对公开 API 与 v1 检查更新都不可见。显式设为正式发布。
  releaseType: release
win:
  target: nsis
  icon: build/icon.ico
  # 可执行文件名用 prism2（productName 含空格，不直接用做 exe 名），与 v1 的 prism.exe 区分
  executableName: prism2
nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  oneClick: false
  allowToChangeInstallationDirectory: true
  # 产物名带 -setup 后缀，旧版（v1）更新逻辑按 `*-setup.exe` 精确匹配安装包
  artifactName: ${name}-${version}-setup.${ext}
mac:
  target: dmg
  icon: build/icon.png
linux:
  target:
    - AppImage
  category: Utility
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/

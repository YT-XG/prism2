appId: com.prism.next
# 打包名与 v1（productName: Prism）区分，避免安装目录/自启项/userData 目录（%APPDATA%\Prism 2）与 v1 冲突
productName: Prism 2
directories:
  output: dist
# 只保留中英语言包，砍掉其余 53 个 Chromium 语言 .pak（约 45MB）
electronLanguages:
  - en-US
  - zh-CN
# 最高压缩级别减小安装包体积（构建时间略增）
compression: maximum
files:
  - out/**
  - resources/**
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # sql.js 运行时只需 sql-wasm.js + sql-wasm.wasm（locateFile 加载），排除 asm/debug/worker/zip/browser 变体约 22MB
  - '!node_modules/sql.js/dist/sql-asm*'
  - '!node_modules/sql.js/dist/worker*'
  - '!node_modules/sql.js/dist/*-debug*'
  - '!node_modules/sql.js/dist/sql-wasm-browser*'
  - '!node_modules/sql.js/dist/sqljs-all.zip'
  # Chromium 许可证页（约 19.5MB），运行不需要
  - '!**/LICENSES.chromium.html'
asarUnpack:
  - resources/**
publish:
  provider: github
  # GitHub Release 发布目标：https://github.com/YT-XG/prism2
  owner: YT-XG
  repo: prism2
  # 关键：electron-builder 默认会把不存在的 release 建成“草稿”（draft），
  # 草稿对公开 API 与 v1 检查更新都不可见。显式设为正式发布。
  releaseType: release
win:
  target: nsis
  icon: build/icon.ico
  # 可执行文件名用 prism2（productName 含空格，不直接用做 exe 名），与 v1 的 prism.exe 区分
  executableName: prism2
nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  oneClick: false
  allowToChangeInstallationDirectory: true
  # 产物名带 -setup 后缀，旧版（v1）更新逻辑按 `*-setup.exe` 精确匹配安装包
  artifactName: ${name}-${version}-setup.${ext}
mac:
  # dmg 用于首次安装分发，zip 用于自研自动更新（mac 更新下载的就是这个 zip）
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal
  # electron-builder 26：arch 需在 target 对象内声明（不认 mac.arch 扁平写法）。
  # universal = x64 + arm64 合一，避免产物架构取决于 CI runner。
  #
  # 确定性、无空格产物名（用 ${name}=prism2 而非 productName="Prism 2"）：
  # 避免 GitHub 资产名带空格导致的 .blockmap "already exists" 422（zip 名已被替换成 -，
  # 但 blockmap 保留空格，上传/覆盖判定冲突）。无空格后 zip 与 blockmap 命名一致。
  artifactName: ${name}-${version}-${arch}-${os}.${ext}
  icon: build/icon.png
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
